version: '3'

services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4444:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logs:/var/log/nginx/
    networks:
      - public
      - internal

  api:
    build:
      context: backend
      dockerfile: Dockerfile
    networks:
      - internal

networks:
  public:
  internal:
    internal: true
